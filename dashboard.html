<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voter Dashboard | SecureVote</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="index.html"><i class="fa-solid fa-shield-halved me-2"></i>SecureVote</a>
      <div class="d-flex gap-2"><a class="btn btn-outline-primary" href="results.html">Results</a><button id="logoutBtn" class="btn btn-primary">Logout</button></div>
    </div>
  </nav>
  <main class="dashboard-shell">
    <div class="container">
      <div class="dashboard-heading">
        <div>
          <p class="text-primary fw-semibold mb-1">Voter Module</p>
          <h1 class="h2 mb-1">Candidate Voting Dashboard</h1>
          <p id="welcomeText" class="text-secondary mb-0"></p>
        </div>
        <div id="voteStatusBadge"></div>
      </div>
      <div class="alert alert-info border-0 shadow-sm"><i class="fa-solid fa-circle-info me-2"></i>Select one candidate and submit your vote. Once submitted, your vote cannot be changed.</div>
      <div class="row g-4" id="candidateList"></div>
    </div>
  </main>
  <div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="appToast" class="toast"><div class="toast-body"></div></div></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/vote.js"></script>
</body>
</html>
