<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voter Registration | SecureVote</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="auth-body">
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container"><a class="navbar-brand fw-bold text-primary" href="index.html"><i class="fa-solid fa-shield-halved me-2"></i>SecureVote</a><a class="btn btn-outline-primary" href="login.html">Login</a></div>
  </nav>
  <main class="auth-wrap">
    <div class="auth-card shadow">
      <div class="text-center mb-4">
        <i class="fa-solid fa-user-plus auth-icon"></i>
        <h1 class="h3 mt-3">Voter Registration</h1>
        <p class="text-secondary mb-0">Create your secure voter account</p>
      </div>
      <form id="registerForm" novalidate>
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" id="name" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Student / Voter ID</label>
          <input type="text" id="voterId" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" id="email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Department / Organization</label>
          <input type="text" id="department" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-control" minlength="4" required>
        </div>
        <button class="btn btn-primary w-100" type="submit"><i class="fa-solid fa-check me-2"></i>Register</button>
      </form>
      <p class="text-center mt-3 mb-0 small">Already registered? <a href="login.html">Login here</a></p>
    </div>
  </main>
  <div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="appToast" class="toast"><div class="toast-body"></div></div></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
